appId: com.yjsoft.sqraft
productName: Sqraft
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# 项目没有原生模块：跳过 @electron/rebuild 的空转
npmRebuild: false
# 复用 node_modules 里已解压的 Electron，避免每次从缓存重新解压
electronDist: node_modules/electron/dist
# 命令行工具不能从 asar 里执行，必须放在包外
extraResources:
  - from: resources/bin
    to: bin
mac:
  icon: build/icon.icns
  category: public.app-category.design
  target:
    - target: dmg
      arch:
        - arm64
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Graphics
  mimeTypes:
    - application/x-sqraft
fileAssociations:
  - ext: sqraft
    name: Sqraft Design
    description: Sqraft 设计文件
    role: Editor
    mimeType: application/x-sqraft
