appId: com.yjsoft.sqraft
productName: Sqraft
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  # sourcemap 已关闭（ADR-0030）；保留排除，防止将来误开时把 map 带进 asar
  - "!out/**/*.map"
  - package.json
asar: true
# 打包后、签名前收敛 macOS 痕迹：删用不到的权限文案、helper 显示名改产品名
afterPack: scripts/after-pack.mjs
# 签名之后、打 dmg / zip 之前做公证（ADR-0034 / 2026-11-22 修订）：
# 自己轮询 notarytool（20 秒一行、60 分钟上限），失败给 submission id 与续跑入口；
# 票据在打包前 staple 进 .app，dmg 与自动更新用的 zip 都带着它
afterSign: scripts/after-sign.mjs
# 许可文本随包分发（MIT 要求保留版权声明）；关于面板的「开源许可」打开的就是这里
extraResources:
  - from: node_modules/electron/dist/LICENSE
    to: licenses/LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
  - from: build/third-party-licenses.txt
    to: licenses/third-party-licenses.txt
# 项目没有原生模块：跳过 @electron/rebuild 的空转
npmRebuild: false
# 不再复用 node_modules 里已解压的 Electron（原 electronDist 提速项，ADR-0046）：
# arm64 与 x64 需要两份 dist，指向单份会让两个包共用同一份运行时。
# 首次构建会按架构下载到 electron-builder 缓存，离线环境要预留。
mac:
  icon: build/icon.icns
  category: public.app-category.design
  # Electron 37 的运行时下限是 macOS 11；显式写出来，避免被 Electron 自带 plist 带走（ADR-0046）
  minimumSystemVersion: "11.0"
  # 发版必须签名（Developer ID Application，见 ADR-0034）：找不到证书直接让构建失败，
  # 而不是像默认行为那样 warn 一句就静默出不签名的包。快验用 `pnpm dist:dir`（会关掉它）。
  # 身份不写死，靠钥匙串自动发现；一台机器上有多张 Developer ID 证书时用 CSC_NAME 指定。
  forceCodeSigning: true
  # 公证要求 hardened runtime 打开。electron-builder 默认就是 true，写出来防止被随手关掉。
  hardenedRuntime: true
  gatekeeperAssess: false
  # 只开 V8 必需的两条；不要照抄 electron-builder 的隐式模板（它还含 disable-library-validation）
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # 公证（ADR-0034 / 2026-11-22 修订）：内建公证（`@electron/notarize` 的
  # `notarytool submit --wait`）全程无输出、超时不可控，2026-11-13 两次提交各挂了约 24 小时。
  # 这里保持 false，改由 afterSign 钩子（scripts/after-sign.mjs）自己 submit + 轮询 + staple；
  # 凭据只从环境变量读（APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER，
  # 或 APPLE_ID 三件套、APPLE_KEYCHAIN_PROFILE），票据由 `xcrun stapler` 落到 .app。
  notarize: false
  # 产物命名带架构（ADR-0046）：dmg → Sqraft-<v>-arm64.dmg / Sqraft-<v>-x64.dmg，zip 同理
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    # 自动更新必须用 zip：dmg 是只读挂载，没法原地替换 .app（ADR-0029）
    - target: zip
      arch:
        - arm64
        - x64
# Windows：只出 x64 的 NSIS 安装器。未签名，本版也不做静默升级（ADR-0033）。
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  # 经典向导：可选安装目录；perMachine 关闭时默认按用户安装（%LOCALAPPDATA%）
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sqraft
  # 卸载不碰用户数据：偏好、最近文件、MCP 配置都留着
  deleteAppDataOnUninstall: false
  # 与应用内四语对齐；安装器按系统语言自动选择
  installerLanguages:
    - en_US
    - zh_CN
    - ja_JP
    - ko_KR
  # 没有 electron-updater，差分包只会拖慢构建
  differentialPackage: false
fileAssociations:
  - ext: sqraft
    name: Sqraft Design
    description: Sqraft 设计文件
    role: Editor
    mimeType: application/x-sqraft
