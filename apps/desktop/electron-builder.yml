appId: com.yjsoft.sqraft
productName: Sqraft
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# 打包后、签名前收敛 macOS 痕迹：删用不到的权限文案、helper 显示名改产品名
afterPack: scripts/after-pack.mjs
# 许可文本随包分发（MIT 要求保留版权声明）；关于面板的「开源许可」打开的就是这里
extraResources:
  - from: node_modules/electron/dist/LICENSE
    to: licenses/LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
  - from: build/third-party-licenses.txt
    to: licenses/third-party-licenses.txt
# 项目没有原生模块：跳过 @electron/rebuild 的空转
npmRebuild: false
# 复用 node_modules 里已解压的 Electron，避免每次从缓存重新解压
electronDist: node_modules/electron/dist
mac:
  icon: build/icon.icns
  category: public.app-category.design
  target:
    - target: dmg
      arch:
        - arm64
win:
  icon: build/icon.png
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Graphics
  mimeTypes:
    - application/x-sqraft
fileAssociations:
  - ext: sqraft
    name: Sqraft Design
    description: Sqraft 设计文件
    role: Editor
    mimeType: application/x-sqraft
