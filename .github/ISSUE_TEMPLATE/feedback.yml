name: Feedback
description: How Sqraft fits your work — including what felt wrong
body:
  - type: markdown
    attributes:
      value: |
        一句话也算数。不用复现步骤，不用整理格式：卡在哪、你本来想做什么、看到什么，写清楚就行。
        For bugs you can reproduce, the Bug report form gets you a faster fix.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of feedback
      options:
        - Could not install or open it
        - Something broke
        - Missing something I needed
        - It works but looks or feels wrong
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Your own words are fine. Screenshots or a screen recording help most here.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What you were trying to do
      description: The page, the file, or the task. This is often more useful than the symptom.
  - type: input
    id: version
    attributes:
      label: Sqraft version
      description: Shown in Sqraft → About.
      placeholder: 0.0.9
  - type: input
    id: system
    attributes:
      label: System
      placeholder: macOS 15.1, Apple M2 / Windows 11 x64
