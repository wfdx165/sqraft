name: Feature request
description: Suggest a capability or a change in behaviour
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Sqraft is a local-first desktop app with a deliberately narrow
        scope. Describe the problem before the solution — a workaround you
        already tried is useful context.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Sqraft makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Sqraft do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or a different design.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references, or the kind of work this is for.
